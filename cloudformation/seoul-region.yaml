  ## GA 환경을 위함 ##
  ### ALB ###
  # TG
  SEOULALBTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: SEOULWEBSRV2    
    Properties:
      Name: SEOUL-ALB-TG
      Port: 80
      # TCP가 아니고 HTTP
