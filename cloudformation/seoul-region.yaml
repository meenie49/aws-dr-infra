        - Id: !Ref SEOULWEBSRV1
          Port: 80
        - Id: !Ref SEOULWEBSRV2
          Port: 80
      Tags:
      - Key : Name
        Value : SEOUL-ALBTG

  # ALB
  SEOULALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
    # 기본값이 ALB라서 따로 타입 안써줘도됨
      Name: SEOULALB
      Scheme: internet-facing
      SecurityGroups:
        - !Ref SEOULSG1
      Subnets:
        - !Ref SEOULPublicSN1
        - !Ref SEOULPublicSN2

  # 리스너
  SEOULALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
      # 트래픽을 대상(Target Group)으로 전달한다는 의미
        - Type: forward
          TargetGroupArn: !Ref SEOULALBTG
      LoadBalancerArn: !Ref SEOULALB
      Port: 80
