  ############################## DNS 파트 #############################
  
  ### Route 53 ###
  ### 프라이빗 호스팅 ###
  # 호스팅 영역
  SEOULPrivateHZ:
    Type: AWS::Route53::HostedZone
    # VPC 내에서만 DNS가 유효
    # VPC가 존재하지 않으면 호스티드 존을 해당 VPC에 연결할 수 없기 때문
    DependsOn: SEOULVPC
    Properties:
      HostedZoneConfig:
        Comment: Private hosted zone for seoul.net
      # 이 호스티드 존은 seoul.internal이라는 도메인 이름을 관리
      Name: awsseoul.internal
      # 프라이빗 호스팅 영역이기 때문에 VPC 설정 해줘야함
      VPCs:
      # 이 호스티드 존이 연결될 VPC
        - VPCId: !Ref SEOULVPC
      # 해당 VPC가 속한 AWS 리전
          VPCRegion: ap-northeast-2
      HostedZoneTags:
        - Key: Name
          Value: seouldomain

  # seoul.internal 존에 만들 A 레코드
  ARecordSEOULWEBSRV1:
    Type: AWS::Route53::RecordSet
    Properties:
    # 이 호스트 영역(존)에 레코드 만들겠다.
      HostedZoneId: !Ref SEOULPrivateHZ
      Comment: DNS name for SEOUL-WEBSRV-1 instance.
    # 도메인 이름
      Name: websrv1.awsseoul.internal
      Type: A
      TTL: 60
    # 위의 도메인의 IP
      ResourceRecords:
      - !GetAtt SEOULWEBSRV1.PrivateIp

  ARecordSEOULWEBSRV2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref SEOULPrivateHZ
      Comment: DNS name for SEOUL-WEBSRV-2 instance.
      Name: websrv2.awsseoul.internal
      Type: A
      TTL: 60
      ResourceRecords:
      - !GetAtt SEOULWEBSRV2.PrivateIp

  ### DNS 쿼리 ###
  # 인바운드 엔드 포인트
  SEOULInboundEP:
    Type: AWS::Route53Resolver::ResolverEndpoint
    Properties:
      Direction: INBOUND
      IpAddresses:
        - Ip: 10.1.3.250
          SubnetId: !Ref SEOULPrivateSN1
        - Ip: 10.1.4.250
          SubnetId: !Ref SEOULPrivateSN2
      SecurityGroupIds:
        - !Ref SEOULSG2
      Tags:
        - Key: Name
          Value: idc-to-seoul-inbound

  # 아웃바운드 엔드포인트
  SEOULOutboundEP:
    Type: AWS::Route53Resolver::ResolverEndpoint
    Properties:
      Direction: OUTBOUND
      IpAddresses:
        - Ip: 10.1.3.251
          SubnetId: !Ref SEOULPrivateSN1
        - Ip: 10.1.4.251
          SubnetId: !Ref SEOULPrivateSN2
      SecurityGroupIds:
        - !Ref SEOULSG2
      Tags:
        - Key: Name
          Value: seoul-to-idc-outbound
  
  # 포워드 규칙
  SEOULForwardRule1:
    Type: AWS::Route53Resolver::ResolverRule
    Properties:
      DomainName: idcseoul.internal
      Name: SEOUL-To-IDC-ForwardRule
      ResolverEndpointId: !Ref SEOULOutboundEP
      RuleType: FORWARD
      Tags:
        - Key: Name
          Value: idc seoul rule
      TargetIps:
      # idcseoul.internal의 DNS 서버 주소
        - Ip: 10.2.1.200
          Port: 53
  
  # 포워드 규칙과 VPC 연결
  # 아웃바운드 포워드 규칙을 넣을 VPC
  SEOULResolverRuleAssociation1:
    Type: AWS::Route53Resolver::ResolverRuleAssociation
    Properties:
      Name: SEOUL-Resolver-Rule-Association1
      ResolverRuleId: !Ref SEOULForwardRule1
      VPCId: !Ref SEOULVPC

  SEOULForwardRule2:
    Type: AWS::Route53Resolver::ResolverRule
    Properties:
      DomainName: awssingapore.internal
      Name: aws singapore rule
      ResolverEndpointId: !Ref SEOULOutboundEP
      RuleType: FORWARD
      Tags:
        - Key: Name
          Value: aws singapore rule
      TargetIps:
        - Ip : 10.3.3.250
          Port : 53

  SEOULResolverRuleAssociation2:
    Type: AWS::Route53Resolver::ResolverRuleAssociation
    Properties:
      Name: SEOUL-Resolver-Rule-Association2
      ResolverRuleId: !Ref SEOULForwardRule2
      VPCId: !Ref SEOULVPC

  SEOULForwardRule3:
    Type: AWS::Route53Resolver::ResolverRule
    Properties:
      DomainName: idcsingapore.internal
      Name: idc singapore rule
      ResolverEndpointId: !Ref SEOULOutboundEP
      RuleType: FORWARD
      Tags:
        - Key: Name
          Value: idc singapore rule
      TargetIps:
        - Ip : 10.4.1.200
          Port : 53

  SEOULResolverRuleAssociation3:
    Type: AWS::Route53Resolver::ResolverRuleAssociation
    Properties:
      Name: SEOUL-Resolver-Rule-Association3
      ResolverRuleId: !Ref SEOULForwardRule3
      VPCId: !Ref SEOULVPC


  ############################## DNS 파트 #############################

  # 서울 Transit Gateway
  SEOULTGW:
    Type: AWS::EC2::TransitGateway
    Properties:
      Tags:
        - Key: Name
          Value: SEOULTGW

  # SEOUL VPC와 TGW를 연결
  # 콘솔에서 attachment 타입을 VPC로 한 것
  SEOULVPCTGWAtt:
    Type: AWS::EC2::TransitGatewayAttachment
    DependsOn: SEOULVPC
    Properties:
      VpcId: !Ref SEOULVPC
      # VPC 내부에서 Transit Gateway와 통신할 수 있는 서브넷의 ID 목록.
      SubnetIds:
        - !Ref SEOULTGWSN1
        - !Ref SEOULTGWSN2
      TransitGatewayId: !Ref SEOULTGW
      Tags:
        - Key: Name
          Value: SEOUL-VPC-TGWAtt

  # VPC -> TGW 가는 경로 추가
  # VPC의 라우트 테이블에 Transit Gateway로의 라우팅 규칙을 추가
  SEOULVPCTGWRoute1:
    Type: AWS::EC2::Route
    DependsOn: SEOULVPCTGWAtt
    Properties:
    # 이 경로가 추가될 라우트 테이블
      RouteTableId: !Ref SEOULPrivateRT1
      # 10.0.0.0/8 대역 트래픽이 Transit Gateway로 전송되도록 설정
      DestinationCidrBlock: 10.0.0.0/8
      # 트래픽을 전달할 TGW
      TransitGatewayId: !Ref SEOULTGW

  SEOULVPCTGWRoute2:
    Type: AWS::EC2::Route
    DependsOn: SEOULVPCTGWAtt
    Properties:
    # 이 경로가 추가될 라우트 테이블
      RouteTableId: !Ref SEOULPrivateRT2
      # 10.0.0.0/8 대역 트래픽이 Transit Gateway로 전송되도록 설정
      DestinationCidrBlock: 10.0.0.0/8
      # 트래픽을 전달할 TGW
      TransitGatewayId: !Ref SEOULTGW


  ### IDC-VPC ###
  # VPC
  IDCSEOULVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.2.0.0/16
      # 둘다 true로 해주면 -> resolv.conf 파일 nameserver 10.2.1.200
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: IDC-SEOUL-VPC

  # IGW
  IDCSEOULIGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: IDC-SEOUL-IGW
  
  # VPC-IGW 
  IDCSEOULVPCIGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref IDCSEOULIGW
      VpcId: !Ref IDCSEOULVPC

  # RT
  IDCSEOULDNSDBRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref IDCSEOULVPC
      Tags:
        - Key: Name
          Value: IDCSEOUL-IGW-RT

  IDCSEOULCGWRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref IDCSEOULVPC
      Tags:
        - Key: Name
          Value: IDCSEOUL-CGW-RT

  # IGW - RT
  IDCSEOULDNSDBRoute1:
    Type: AWS::EC2::Route
    DependsOn: IDCSEOULVPCIGWAttachment
    Properties:
    # 라우트가 추가될 라우트 테이블
      RouteTableId: !Ref IDCSEOULDNSDBRT
    # 이 IP 주소를 대상으로 하는 경로를 정의
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IDCSEOULIGW
      
  # DNS와 MasterDB가 CGW를 통해 외부와 통신 위해
  IDCSEOULDNSDBRoute2:
    Type: AWS::EC2::Route
    DependsOn: IDCSEOULCGWENI
    Properties:
    # 라우트가 추가될 라우트 테이블
      RouteTableId: !Ref IDCSEOULDNSDBRT
    # 이 IP 주소를 대상으로 하는 경로를 정의
      DestinationCidrBlock: 10.0.0.0/8
    # 위 경로의 트래픽이 전달될 대상 네트워크 인터페이스(ENI)
      NetworkInterfaceId: !Ref IDCSEOULCGWENI

  IDCSEOULCGWRoute:
    Type: AWS::EC2::Route
    DependsOn: IDCSEOULVPCIGWAttachment
    Properties:
    # 라우트가 추가될 라우트 테이블
      RouteTableId: !Ref IDCSEOULCGWRT
    # 이 IP 주소를 대상으로 하는 경로를 정의
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IDCSEOULIGW

  # SN
  IDCSEOULPublicSN:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref IDCSEOULVPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.2.1.0/24
      Tags: 
        - Key: Name
          Value: IDCSEOUL-Public-SN

  IDCSEOULTGWSN:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref IDCSEOULVPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.2.2.0/24
      Tags: 
        - Key: Name
          Value: IDCSEOUL-TGW-SN

  # RT - SN
  IDCSEOULDNSDBSNRTAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref IDCSEOULDNSDBRT
      SubnetId: !Ref IDCSEOULPublicSN

  IDCSEOULTGWSNRTAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref IDCSEOULCGWRT
      SubnetId: !Ref IDCSEOULTGWSN

  # SG
  IDCSEOULCGWDBSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref IDCSEOULVPC
      GroupDescription: IDCSEOUL-CGWDB-SG
      Tags:
      - Key : Name
        Value : IDCSEOUL-CGWDB-SG
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp: 0.0.0.0/0
      - IpProtocol: icmp
        FromPort: -1
        ToPort: -1
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 3306
        ToPort: 3306
        CidrIp: 0.0.0.0/0
      - IpProtocol: udp
        FromPort: 4500
        ToPort: 4500
        CidrIp: 0.0.0.0/0
      - IpProtocol: udp
        FromPort: 53
        ToPort: 53
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 53
        ToPort: 53
        CidrIp: 0.0.0.0/0

  IDCSEOULDNSSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref IDCSEOULVPC
      GroupDescription: IDCSEOUL-DNS-SG
      Tags:
      - Key : Name
        Value : IDCSEOUL-DNS-SG
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        CidrIp: 0.0.0.0/0
      - IpProtocol: udp
        FromPort: 53
        ToPort: 53
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 53
        ToPort: 53
        CidrIp: 0.0.0.0/0
      - IpProtocol: icmp
        FromPort: -1
        ToPort: -1
        CidrIp: 0.0.0.0/0

  # ENI
  IDCSEOULCGWENI:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref IDCSEOULTGWSN
      Description: CGWInstance eth0
      GroupSet:
      - !Ref IDCSEOULCGWDBSG
     # 고정 사설 IP
      PrivateIpAddress: 10.2.2.100
      Tags:
        - Key: Name
          Value: IDCSEOUL-CGWENI 
  
  # EIP
  IDCSEOULCGWEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  # EIP - ENI
  IDCSEOULCGWENIAssociateEIP:
    Type: AWS::EC2::EIPAssociation
    DependsOn: IDCSEOULCGW
    Properties:
      AllocationId: !GetAtt IDCSEOULCGWEIP.AllocationId
      NetworkInterfaceId: !Ref IDCSEOULCGWENI

  # NAT Instance
  IDCSEOULCGW:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t2.micro
      KeyName: !Ref KeyName
      Tags:
        - Key: Name
          Value: IDCSEOUL-CGW
      # 중계 역할
      SourceDestCheck: false
      NetworkInterfaces:
        - DeviceIndex: 0
          NetworkInterfaceId: !Ref IDCSEOULCGWENI
      UserData:
      # 리눅스용 VPN 패키지
      # 커널 수준에서 설정 변경 /etc/sysctl.conf
      # net.ipv4.ip_forward=1 디폴트 값은 0 -> 1로 되어있어야 리눅스에서 전송가능
      # ipsec 데몬
        Fn::Base64: |
          #!/bin/bash
          hostnamectl --static set-hostname IDCSEOUL-CGW
          yum -y install tcpdump openswan
          cat <<EOF>> /etc/sysctl.conf
          net.ipv4.ip_forward=1
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.all.send_redirects = 0
          net.ipv4.conf.default.send_redirects = 0
          net.ipv4.conf.eth0.send_redirects = 0
          net.ipv4.conf.default.accept_redirects = 0
          net.ipv4.conf.eth0.accept_redirects = 0
          net.ipv4.conf.ip_vti0.rp_filter = 0
          net.ipv4.conf.eth0.rp_filter = 0
          net.ipv4.conf.default.rp_filter = 0
          net.ipv4.conf.all.rp_filter = 0
          EOF
          sysctl -p /etc/sysctl.conf
          curl -o /etc/ipsec.d/vpnconfig.sh https://cloudneta-book.s3.ap-northeast-2.amazonaws.com/chapter6/6_lab_s2s-vpnconfig.sh
          chmod +x /etc/ipsec.d/vpnconfig.sh

          sed -i 's/leftsubnet=10\.60\.0\.0\/16/leftsubnet=10.2.0.0\/16/' /etc/ipsec.d/vpnconfig.sh
          sed -i 's/rightsubnet=10\.50\.0\.0\/16/rightsubnet=10.0.0.0\/8/' /etc/ipsec.d/vpnconfig.sh
          systemctl restart ipsec
          

  ## DNSSRV ##
  # ENI
  # EC2 인스턴스가 VPC 내에서 다른 리소스와 연결되는 방법을 정의
  IDCSEOULDNSENI:
    Type: AWS::EC2::NetworkInterface
    Properties:
    # 인터페이스 내부 속성들 미리 정의
      SubnetId: !Ref IDCSEOULPublicSN
      Description: IIDCSEOULPublicSN eth0
      GroupSet:
      - !Ref IDCSEOULDNSSG
    # 고정 사설 IP
      PrivateIpAddress: 10.2.1.200
    # 기본값 true, 그러나 false도 포워딩 역할 아니므로 필요없음
      Tags:
        - Key: Name
          Value: IDCSEOUL-DNS-ENI

  # DNSSRV에 공인 IP 할당
  IDCSEOULDNSEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  # ENI - EIP        
  IDCSEOULDNSENIAssociateEIP:
    Type: AWS::EC2::EIPAssociation
  # EIP와 ENI가 생성되고 연결되기 전에 IDCSEOULDNSSRV 인스턴스가 생성되면 안 되므로
    DependsOn: IDCSEOULDNSSRV
    Properties:
      # AllocationId는 Elastic IP의 고유 식별자
      AllocationId: !GetAtt IDCSEOULDNSEIP.AllocationId
      # 구성된 네트워크 인터페이스(ENI)를 참조하여 어떤 ENI에 EIP를 연결할지를 지정
      NetworkInterfaceId: !Ref IDCSEOULDNSENI

  IDCSEOULDNSSRV:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t2.micro
      KeyName: !Ref KeyName
      Tags:
        - Key: Name
          Value: IDCSEOUL-DNSSRV
      NetworkInterfaces:
        - DeviceIndex: 0
          # 서브넷 없는 이유 ENI에 들어가 있기 때문
          NetworkInterfaceId: !Ref IDCSEOULDNSENI
      UserData:
        Fn::Base64: |
          #!/bin/bash
          hostnamectl --static set-hostname IDCSEOUL-DNSSRV
          amazon-linux-extras install epel -y
          yum -y install bind bind-utils bind-libs
          sed -i "s/listen-on port 53 { 127.0.0.1; }/listen-on port 53 { any; }/g" /etc/named.conf
          sed -i "s/allow-query     { localhost; }/allow-query     { any; }/g" /etc/named.conf
          sed -i "s/dnssec-enable yes/dnssec-enable no/g" /etc/named.conf		  
          sed -i "s/dnssec-validation yes/dnssec-validation no/g" /etc/named.conf
          
          cat <<EOF>> /etc/named.rfc1912.zones	
          zone "idcseoul.internal" {
              type master;
              file "/var/named/idcseoul.internal";
              allow-update { none; };
          };		  
          zone "awsseoul.internal" {
              type forward;
              forward only;
              forwarders { 10.1.3.250; 10.1.4.250; };
          };
          zone "awssingapore.internal" {
              type forward;
              forward only;
              forwarders { 10.3.3.250; };
          }; 
          zone "idcsingapore.internal" {
              type forward;
              forward only;
              forwarders { 10.4.1.200; };
          };            
          EOF
          
          cat <<EOF> /var/named/idcseoul.internal
          \$TTL 300
          @ IN SOA idcseoul.internal. root.idcseoul.internal. (
            2019122114 ; serial
            3600       ; refresh
            900        ; retry
            604800     ; expire
            86400      ; minimum
          )

          @           IN NS ns1.idcseoul.internal.
          ns1         IN A  10.2.1.200
          dbsrv       IN A  10.2.1.100
          dnssrv      IN A  10.2.1.200
          
          EOF

          cat <<EOF> /var/named/idcsingapore.internal
          \$TTL 300
          @ IN SOA idcsingapore.internal. root.idcsingapore.internal. (
            2019122114 ; serial
            3600       ; refresh
            900        ; retry
            604800     ; expire
            86400      ; minimum
          )

          @           IN NS ns1.idcsingapore.internal.
          ns1         IN A  10.4.1.200
          dbsrv       IN A  10.4.1.100
          dnssrv      IN A  10.4.1.200
          
          EOF

          systemctl enable --now named

  # EC2
  ## Master DB ##
  IDCSEOULMasterDB:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t2.micro
      KeyName: !Ref KeyName
      Tags:
        - Key: Name
          Value: IDCSEOUL-MasterDB
      NetworkInterfaces:
        - DeviceIndex: 0
          SubnetId: !Ref IDCSEOULPublicSN
          GroupSet:
          - !Ref IDCSEOULCGWDBSG
          AssociatePublicIpAddress: true
          PrivateIpAddress: 10.2.1.100
      UserData:
      # /etc/resolv.conf 파일이 네임서버가 DNSSRV 설정이 되어 있어야함
        Fn::Base64: |
          #!/bin/bash
          (
          echo "CHANGE_ME_PASSWORD"
          echo "CHANGE_ME_PASSWORD"
          ) | passwd --stdin root
          sed -i "s/^PasswordAuthentication no/PasswordAuthentication yes/g" /etc/ssh/sshd_config
          sed -i "s/^#PermitRootLogin yes/PermitRootLogin yes/g" /etc/ssh/sshd_config
          sudo service sshd restart
          sudo sed -i 's/^nameserver 10\.2\.0\.2$/nameserver 10.2.1.200/' /etc/resolv.conf

          cat <<EOT> /home/ec2-user/list.txt
          10.1.3.100
          websrv1.awsseoul.internal
          10.1.4.100
          websrv2.awsseoul.internal
          10.2.1.100
          dbsrv.idcseoul.internal
          10.2.1.200
          dnssrv.idcseoul.internal
          10.3.3.100
          websrv1.awssingapore.internal
          10.4.1.100
          dbsrv.idcsingapore.internal
          10.4.1.200
          dnssrv.idcsingapore.internal
          EOT
          curl -o /home/ec2-user/pingall.sh https://cloudneta-book.s3.ap-northeast-2.amazonaws.com/chapter6/pingall.sh --silent
          chmod +x /home/ec2-user/pingall.sh

          hostnamectl --static set-hostname IDCSEOUL-MasterDB

          amazon-linux-extras install epel -y   
          sudo yum install -y https://dev.mysql.com/get/mysql80-community-release-el7-6.noarch.rpm
          sudo rpm --import https://repo.mysql.com/RPM-GPG-KEY-mysql-2022
          sudo sed -i '/^\[mysql80-community\]/,/^$/s/^gpgcheck=1/gpgcheck=0/' /etc/yum.repos.d/mysql-community.repo
          sudo yum update -y
          sudo yum install -y mysql-server
          sudo systemctl start mysqld
          sudo systemctl enable mysqld
          sudo yum install -y sshpass

          sudo echo -e "\ncollation-server = utf8mb4_unicode_ci\ninit-connect='SET NAMES utf8mb4'\ncharacter-set-server = utf8mb4\nvalidate_password.policy = LOW\ndefault_authentication_plugin = mysql_native_password\n\n[client]\ndefault-character-set = utf8mb4\n\n[mysql]\ndefault-character-set = utf8mb4" | sudo tee -a /etc/my.cnf
          sudo systemctl restart mysqld

          TEMP_PASS=$(grep 'temporary password' /var/log/mysqld.log | awk '{print $NF}')
          mysql -uroot -p"$TEMP_PASS" --connect-expired-password -e " ALTER USER 'root'@'localhost' IDENTIFIED BY 'CHANGE_ME_PASSWORD';"
          
          while ! mysqladmin ping --silent; do
              echo "Waiting for MySQL to be ready..."
              sleep 5
          done

          mysql -uroot -pCHANGE_ME_PASSWORD <<EOF
          CREATE DATABASE sqlDB;
          CREATE USER 'user1'@'%' IDENTIFIED BY 'CHANGE_ME_PASSWORD';

          GRANT ALL PRIVILEGES ON sqlDB.* TO 'user1'@'%';
          GRANT REPLICATION SLAVE ON *.* TO 'user1'@'%';
          FLUSH PRIVILEGES;

          USE sqlDB;
          CREATE TABLE userTBL (
              userID CHAR(8) NOT NULL PRIMARY KEY,
              name NVARCHAR(10) NOT NULL,
              birthYear INT NOT NULL,
              addr NCHAR(2) NOT NULL,
              mobile1 CHAR(3),
              mobile2 CHAR(8),
              height SMALLINT,
              mDATE DATE
          ) CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;

          INSERT INTO userTBL (userID, name, birthYear, addr, mobile1, mobile2, height, mDATE) VALUES
          ('HGD', '홍길동', 1990, '서울', '010', '12345678', 175, '2025-01-01'),
          ('KCS', '김철수', 1985, '부산', '010', '87654321', 180, '2025-01-02'),
          ('LYH', '이영희', 1992, '대구', '010', '11223344', 160, '2025-01-03');  
          EOF



  ### IDC -TGW ###
  # IDC의 CGW 인식시키게 하기
  IDCSEOULCGWPerceive:
    Type: AWS::EC2::CustomerGateway
    DependsOn: IDCSEOULCGWEIP
    Properties:
      Type: ipsec.1
      BgpAsn: 65000
      # IDC의 CGW 공인IP
      IpAddress: !Ref IDCSEOULCGWEIP
      Tags:
        - Key: Name
          Value: IDCSEOUL-CGW-Perceive

  # CGW - TGW 연결
  SEOULVPCIDCVpnConnection:
    Type: AWS::EC2::VPNConnection
    Properties:
      # VPN 연결의 유형을 지정
      # IPsec 기반의 사이트-투-사이트 VPN을 설정
      Type: ipsec.1
      # 정적 경로
      # TGW 라우팅 테이블로 자동으로 경로 안들어오기 때문에
      StaticRoutesOnly: true
      # 인식시킨 CGW
      CustomerGatewayId: !Ref IDCSEOULCGWPerceive
      # VPC가 아닌 VPN과 연결
      TransitGatewayId: !Ref SEOULTGW
      VpnTunnelOptionsSpecifications:
      # PSK
        - PreSharedKey: CHANGE_ME_PSK
      Tags:
        - Key: Name
          Value: SEOULVPC-IDCVpn-Connection
  
  # 배포 후 VPN 연결로 생성된 값을 채워 주석을 해제합니다.
  # (TGW 라우팅 테이블에는 VPN 경로가 자동으로 들어오지 않아 정적 경로를 추가)
  # TGWStaticRoute:
  #   Type: AWS::EC2::TransitGatewayRoute
  #   Properties:
  #     DestinationCidrBlock: 10.2.0.0/16
  #     TransitGatewayRouteTableId: <TGW_ROUTE_TABLE_ID>
  #     TransitGatewayAttachmentId: <VPN_TGW_ATTACHMENT_ID>
