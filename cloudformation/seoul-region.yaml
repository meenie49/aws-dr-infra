Parameters:
  LatestAmiId:
    Description: (DO NOT CHANGE)
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2'
    AllowedValues:
      - /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2

  KeyName:
    Description: Name of an existing EC2 KeyPair to enable SSH access to the instances. Linked to AWS Parameter
    Type: AWS::EC2::KeyPair::KeyName
    ConstraintDescription: must be the name of an existing EC2 KeyPair.

Resources:
  # VPC
  SEOULVPC:
    Type: AWS::EC2::VPC
    Properties:
     CidrBlock: 10.1.0.0/16
     EnableDnsSupport: true
     EnableDnsHostnames: true
     Tags:
      - Key: Name
        Value: SEOUL-VPC

  # IGW
  SEOULIGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: SEOUL-IGW
  
  # VPC-IGW 
  SEOULVPCIGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref SEOULIGW
      VpcId: !Ref SEOULVPC

  # RT
  SEOULPublicRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SEOULVPC
      Tags:
        - Key: Name
          Value: SEOUL-Public-RT

  SEOULPrivateRT1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SEOULVPC
      Tags:
        - Key: Name
          Value: SEOUL-Private-RT1

  SEOULPrivateRT2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SEOULVPC
      Tags:
        - Key: Name
          Value: SEOUL-Private-RT2

  SEOULTGWRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SEOULVPC
      Tags:
        - Key: Name
          Value: SEOUL-TGW-RT

  # IGW - RT
  SEOULPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: SEOULVPCIGWAttachment
    Properties:
      RouteTableId: !Ref SEOULPublicRT
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref SEOULIGW

  # NAT Route
  # PublicSN - RT - NATInstance
  # 프라이빗 서브넷의 트래픽이 인터넷으로 나가기 위해 SEOULNATInstance1을 경유하도록 설정
  NATInstance1Route:
    Type: AWS::EC2::Route
    DependsOn: SEOULNATInstance1
    Properties:
      RouteTableId: !Ref SEOULPrivateRT1
      DestinationCidrBlock: 0.0.0.0/0
      InstanceId: !Ref SEOULNATInstance1

  NATInstance2Route:
    Type: AWS::EC2::Route
    DependsOn: SEOULNATInstance2
    Properties:
      RouteTableId: !Ref SEOULPrivateRT2
      DestinationCidrBlock: 0.0.0.0/0
      InstanceId: !Ref SEOULNATInstance2

  # SN
  SEOULPublicSN1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SEOULVPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.1.1.0/24
      Tags: 
        - Key: Name
          Value: SEOUL-Public-SN1
  
  SEOULPublicSN2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SEOULVPC
      AvailabilityZone: !Select [2, !GetAZs '']
      CidrBlock: 10.1.2.0/24
      Tags: 
        - Key: Name
          Value: SEOUL-Public-SN2

  SEOULPrivateSN1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SEOULVPC
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      CidrBlock: 10.1.3.0/24
      Tags:
        - Key: Name
          Value: SEOUL-Private-SN1

  SEOULPrivateSN2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SEOULVPC
      AvailabilityZone: !Select [ 2, !GetAZs '' ]
      CidrBlock: 10.1.4.0/24
      Tags:
        - Key: Name
          Value: SEOUL-Private-SN2

  SEOULTGWSN1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SEOULVPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.1.5.0/24
      Tags: 
        - Key: Name
          Value: SEOUL-TGW-SN1

  SEOULTGWSN2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SEOULVPC
      AvailabilityZone: !Select [2, !GetAZs '']
      CidrBlock: 10.1.6.0/24
      Tags: 
        - Key: Name
          Value: SEOUL-TGW-SN2

  # RT - SN
  SEOULPublicSNRTAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref SEOULPublicRT
      SubnetId: !Ref SEOULPublicSN1
  
  SEOULPublicSNRTAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref SEOULPublicRT
      SubnetId: !Ref SEOULPublicSN2

  SEOULPrivateSNRTAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref SEOULPrivateRT1
      SubnetId: !Ref SEOULPrivateSN1

  SEOULPrivateSNRTAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref SEOULPrivateRT2
      SubnetId: !Ref SEOULPrivateSN2

  SEOULTGWSNRTAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref SEOULTGWRT
      SubnetId: !Ref SEOULTGWSN1

  SEOULTGWSNRTAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref SEOULTGWRT
      SubnetId: !Ref SEOULTGWSN2

  # SG 
  SEOULSG1:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref SEOULVPC
      GroupDescription: SEOULVPC-NAT-ALB-WEBSRV-SG
      Tags:
      - Key : Name
        Value : SEOULVPC-NAT-ALB-WEBSRV-SG
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        CidrIp: 0.0.0.0/0
      - IpProtocol: icmp
        FromPort: -1
        ToPort: -1
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 3306
        ToPort: 3306
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 53
        ToPort: 53
        CidrIp: 0.0.0.0/0
      - IpProtocol: udp
        FromPort: 53
        ToPort: 53
        CidrIp: 0.0.0.0/0

  SEOULSG2:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref SEOULVPC
      GroupDescription: SEOULVPC-Route53-Resolver-SG
      Tags:
      - Key : Name
        Value : SEOULVPC-Route53-Resolver-SG
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 53
        ToPort: 53
        CidrIp: 0.0.0.0/0
      - IpProtocol: udp
        FromPort: 53
        ToPort: 53
        CidrIp: 0.0.0.0/0
      - IpProtocol: icmp
        FromPort: -1
        ToPort: -1
        CidrIp: 0.0.0.0/0

  ### NAT ###

  # ENI
  # Private <-> Public 
  # EC2 인스턴스가 VPC 내에서 다른 리소스와 연결되는 방법을 정의
  # NAT 인스턴스가 VPC 내에서 통신하기 위한 네트워크 인터페이스
  # ENI를 통해 서브넷에 연결됨
  # NAT 인스턴스의 네트워크 구성을 따로 만든 것
  SEOULNATENI1:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref SEOULPublicSN1
      Description: Instance1 eth0
      GroupSet:
      - !Ref SEOULSG1
     # 고정 사설 IP
      PrivateIpAddress: 10.1.1.100
      # NAT 만들 때 반드시 들어가야함
      # 중계 역할이므로 false로
      SourceDestCheck: false
      Tags:
        - Key: Name
          Value: SEOUL-NAT-Instance1 eth0

  SEOULNATENI2:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref SEOULPublicSN2
      Description: Instance2 eth0
      GroupSet:
      - !Ref SEOULSG1
     # 고정 사설 IP
      PrivateIpAddress: 10.1.2.100
      SourceDestCheck: false
      Tags:
        - Key: Name
          Value: SEOUL-NAT-Instance2 eth0
  
  # EIP
  # NAT 인스턴스가 인터넷 통신 위해 고정된 퍼블릭 IP 주소 받음
  # EIP는 VPC에 받는 것이므로
  SEOULEIP1:
    Type: AWS::EC2::EIP
    Properties:
    # Elastic IP가 VPC 내에서 사용될 것임을 지정
      Domain: vpc

  SEOULEIP2:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  # EIP - ENI
  # EIP와 ENI를 연결 
  # 특정 VPC에 넣기 위해 
  SEOULENIAssociateEIP1:
    Type: AWS::EC2::EIPAssociation
    DependsOn: SEOULNATInstance1
    Properties:
      # EIP를 참조
      # AllocationId는 Elastic IP의 고유 식별자
      # 생성한 EIP를 참조하여 해당 EIP의 고유 식별자를 가져옴
      AllocationId: !GetAtt SEOULEIP1.AllocationId
      # ENI를 참조
      # 특정 네트워크 인터페이스(ENI)의 고유 식별자
      # 구성된 네트워크 인터페이스(ENI)를 참조하여 어떤 ENI에 EIP를 연결할지를 지정
      NetworkInterfaceId: !Ref SEOULNATENI1

  SEOULENIAssociateEIP2:
    Type: AWS::EC2::EIPAssociation
    DependsOn: SEOULNATInstance2
    Properties:
      # 속성 참조 - 할당 ID
      AllocationId: !GetAtt SEOULEIP2.AllocationId
      # 네트워크 인터페이스 ID를 리턴함
      NetworkInterfaceId: !Ref SEOULNATENI2

  # NAT Instance
  SEOULNATInstance1:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-01ad0c7a4930f0e43 
      InstanceType: t2.micro
      KeyName: !Ref KeyName
      Tags:
        - Key: Name
          Value: SEOUL-NAT-Instance1
      NetworkInterfaces:
      # ENI에 구성 정보 이미 작성
        - DeviceIndex: 0
          NetworkInterfaceId: !Ref SEOULNATENI1
      UserData:
        Fn::Base64: |
          #!/bin/bash
            hostname SEOUL-NAT-Instance1
            yum -y install tcpdump iptraf

  SEOULNATInstance2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-01ad0c7a4930f0e43 
      InstanceType: t2.micro
      KeyName: !Ref KeyName
      Tags:
        - Key: Name
          Value: SEOUL-NAT-Instance2
      NetworkInterfaces:
        - DeviceIndex: 0
          NetworkInterfaceId: !Ref SEOULNATENI2
      UserData:
        Fn::Base64: |
          #!/bin/bash
            hostname SEOUL-NAT-Instance2
            yum -y install tcpdump iptraf

  # EC2
  SEOULWEBSRV1:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t2.micro
      KeyName: !Ref KeyName
      Tags:
        - Key: Name
          Value: SEOUL-WEBSRV-1
      NetworkInterfaces:
        - DeviceIndex: 0
          SubnetId: !Ref SEOULPrivateSN1
          GroupSet:
          - !Ref SEOULSG1
          PrivateIpAddress: 10.1.3.100
      # 설치 확인하려면 bastion host ec2로 들어가서 keys 저장하고 -> chmod -> ssh -i
      UserData:
        Fn::Base64: |
          #!/bin/bash
          (
          echo "CHANGE_ME_PASSWORD"
          echo "CHANGE_ME_PASSWORD"
          ) | passwd --stdin root
          sed -i "s/^PasswordAuthentication no/PasswordAuthentication yes/g" /etc/ssh/sshd_config
          sed -i "s/^#PermitRootLogin yes/PermitRootLogin yes/g" /etc/ssh/sshd_config
          sudo service sshd restart

          hostnamectl --static set-hostname Seoul-WEBSRV1
          amazon-linux-extras install epel -y 
          sudo yum install -y httpd php php-mysql tcpdump         
          sudo systemctl enable --now httpd 
          sudo sed -i 's/;date.timezone =/date.timezone = Asia\/Seoul/' /etc/php.ini
          sudo sed -i 's/display_errors = Off/display_errors = On' /etc/php.ini
          sudo systemctl restart httpd

          cat << EOF > /var/www/html/index.html
          <HTML>
          <HEAD>
          <META http-equiv="content-type" content="text/html; charset=utf8mb4">
          </HEAD>
          <BODY>
          <h1> 회원 관리 시스템1 </h1>
          <a href='select.php'> (1) 회원 조회 (조회 후 수정/삭제 가능) </a> <br><br>
          <a href='insert.php'> (2) 신규 회원 등록 </a> <br><br>
          <FORM METHOD="get"  ACTION="update.php">
              (3) 회원 수정 - 회원 아이디 : <INPUT TYPE ="text" NAME="userID"> 
              <INPUT TYPE="submit"  VALUE="수정">
          </FORM>
          <FORM METHOD="get"  ACTION="delete.php">
              (4) 회원 삭제 - 회원 아이디 : <INPUT TYPE ="text" NAME="userID"> 
              <INPUT TYPE="submit"  VALUE="삭제">
          </FORM>
          </BODY>
          </HTML>
          EOF

          echo "<?php          
          \$con=mysqli_connect(\"10.2.1.100\", \"user1\", \"CHANGE_ME_PASSWORD\", \"sqlDB\") or die(\"MySQL 접속 실패 !!\");
          mysqli_query(\$con, \"set session character_set_connection=utf8mb4;\");
          mysqli_query(\$con, \"set session character_set_results=utf8mb4;\");
          mysqli_query(\$con, \"set session character_set_client=utf8mb4;\");
          \$sql =\"SELECT * FROM userTBL\";
 
          \$ret = mysqli_query(\$con, \$sql);   
          if(\$ret) {
              \$count = mysqli_num_rows(\$ret);
          }
          else {
              echo \"userTBL 데이터 조회 실패!!!\".\"<br>\";
              echo \"실패 원인 :\".mysqli_error(\$con);
              exit();
          } 
   
          echo \"<h1> 회원 조회 결과1 </h1>\";
          echo \"<TABLE border=1>\";
          echo \"<TR>\";
          echo \"<TH>아이디</TH><TH>이름</TH><TH>출생년도</TH><TH>지역</TH><TH>극번</TH>\";
          echo \"<TH>전화번호</TH><TH>키</TH><TH>가입일</TH><TH>수정</TH><TH>삭제</TH>\";
          echo \"</TR>\";
   
          while(\$row = mysqli_fetch_array(\$ret)) {
             echo \"<TR>\";
             echo \"<TD>\", \$row['userID'], \"</TD>\";
             echo \"<TD>\", \$row['name'], \"</TD>\";
             echo \"<TD>\", \$row['birthYear'], \"</TD>\";
             echo \"<TD>\", \$row['addr'], \"</TD>\";
             echo \"<TD>\", \$row['mobile1'], \"</TD>\";
             echo \"<TD>\", \$row['mobile2'], \"</TD>\";
             echo \"<TD>\", \$row['height'], \"</TD>\";
             echo \"<TD>\", \$row['mDATE'], \"</TD>\";
             echo \"<TD>\", \"<a href='update.php?userID=\", \$row['userID'], \"'>수정</a>\", \"</TD>\";
             echo \"<TD>\", \"<a href='delete.php?userID=\", \$row['userID'], \"'>삭제</a>\", \"</TD>\";
             echo \"</TR>\";
          }   
          mysqli_close(\$con);
          echo \"</TABLE>\";
          echo \"<br> <a href='main.html'> <--초기 화면</a> \";
                 ?>" > /var/www/html/select.php

          cat > /var/www/html/insert.php <<EOF
          <HTML>
          <HEAD>
          <META http-equiv="content-type" content="text/html; charset=utf-8">
          </HEAD>
          <BODY>
          <h1> 신규 회원 입력1 </h1>
          <FORM METHOD="post" ACTION="insert_result.php"> 
              아이디 :<INPUT TYPE="text" NAME="userID"> <br>
              이름 :<INPUT TYPE="text" NAME="name"> <br>
              출생년도 :<INPUT TYPE="text" NAME="birthYear"> <br>
              지역 :<INPUT TYPE="text" NAME="addr"> <br>
              휴대폰 국번 :<INPUT TYPE="text" NAME="mobile1"> <br>
              휴대폰 전화번호 :<INPUT TYPE="text" NAME="mobile2"> <br>
              신장 :<INPUT TYPE="text" NAME="height"><br>
              <BR><BR>
              <INPUT TYPE="submit" VALUE="회원 입력">
          </FORM>
          </BODY>
          </HTML>
          EOF

          cat > /var/www/html/insert_result.php <<EOF
          <?php
          $con = mysqli_connect("10.2.1.100", "user1", "CHANGE_ME_PASSWORD", "sqlDB") or die("MySQL 접속 실패 !!");
          mysqli_query($con, "set session character_set_connection=utf8mb4;");
          mysqli_query($con, "set session character_set_results=utf8mb4;");
          mysqli_query($con, "set session character_set_client=utf8mb4;");

          \$userID = \$_POST["userID"];
          \$name = \$_POST["name"];
          \$birthYear = \$_POST["birthYear"];
          \$addr = \$_POST["addr"];
          \$mobile1 = \$_POST["mobile1"];
          \$mobile2 = \$_POST["mobile2"];
          \$height = \$_POST["height"];
          \$mDate = date("Y-m-j");

          \$sql = "INSERT INTO userTBL VALUES('\$userID', '\$name', \$birthYear, '\$addr', '\$mobile1', '\$mobile2', \$height, '\$mDate')";

          \$ret = mysqli_query(\$con, \$sql);

          echo "<h1> 신규 회원 입력 결과1 </h1>";
          if(\$ret) {
              echo "데이터가 성공적으로 입력됨.";} else {
              echo "데이터 입력 실패!!!<br>";
              echo "실패 원인 :" . mysqli_error(\$con);}
          mysqli_close(\$con);

          echo "<br> <a href='main.html'> <--초기 화면</a> ";?>
          EOF  

          curl -o /opt/pingcheck.sh https://cloudneta-book.s3.ap-northeast-2.amazonaws.com/chapter8/pingchecker.sh
          chmod +x /opt/pingcheck.sh
          cat <<EOT>> /etc/crontab
          */3 * * * * root /opt/pingcheck.sh
          EOT


