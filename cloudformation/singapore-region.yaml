Parameters:
  LatestAmiId:
    Description: (DO NOT CHANGE)
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2'
    AllowedValues:
      - /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2

  KeyName:
    Description: Name of an existing EC2 KeyPair to enable SSH access to the instances. Linked to AWS Parameter
    Type: AWS::EC2::KeyPair::KeyName
    ConstraintDescription: must be the name of an existing EC2 KeyPair.

Resources:
  # VPC
  SingaporeVPC:
    Type: AWS::EC2::VPC
    Properties:
     CidrBlock: 10.3.0.0/16
     EnableDnsSupport: true
     EnableDnsHostnames: true
     Tags:
      - Key: Name
        Value: Singapore-VPC

  # IGW
  SingaporeIGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: Singapore-IGW
  
  # VPC-IGW 
  SingaporeVPCIGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref SingaporeIGW
      VpcId: !Ref SingaporeVPC

  # RT
  SingaporePublicRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SingaporeVPC
      Tags:
        - Key: Name
          Value: Singapore-Public-RT

  SingaporePrivateRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SingaporeVPC
      Tags:
        - Key: Name
          Value: Singapore-Private-RT

  SingaporeTGWRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SingaporeVPC
      Tags:
        - Key: Name
          Value: Singapore-TGW-RT

  # IGW - RT
  SingaporePublicRoute:
    Type: AWS::EC2::Route
    DependsOn: SingaporeVPCIGWAttachment
    Properties:
      RouteTableId: !Ref SingaporePublicRT
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref SingaporeIGW

  # 프라이빗 서브넷의 트래픽이 인터넷으로 나가기 위해 SingaporeNATInstance을 경유하도록 설정
  NATInstanceRoute:
    Type: AWS::EC2::Route
    DependsOn: SingaporeNATInstance
    Properties:
      RouteTableId: !Ref SingaporePrivateRT
      DestinationCidrBlock: 0.0.0.0/0
      InstanceId: !Ref SingaporeNATInstance

  # SN
  SingaporePublicSN:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SingaporeVPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.3.1.0/24
      Tags: 
        - Key: Name
          Value: Singapore-Public-SN1

  SingaporePrivateSN1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SingaporeVPC
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      CidrBlock: 10.3.3.0/24
      Tags:
        - Key: Name
          Value: Singapore-Private-SN1

  SingaporePrivateSN2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SingaporeVPC
      AvailabilityZone: !Select [ 2, !GetAZs '' ]
      CidrBlock: 10.3.4.0/24
      Tags:
        - Key: Name
          Value: Singapore-Private-SN2

  SingaporeTGWSN1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SingaporeVPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.3.5.0/24
      Tags: 
        - Key: Name
          Value: Singapore-TGW-SN1

  SingaporeTGWSN2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SingaporeVPC
      AvailabilityZone: !Select [2, !GetAZs '']
      CidrBlock: 10.3.6.0/24
      Tags: 
        - Key: Name
          Value: Singapore-TGW-SN2

  # RT - SN
  SingaporePublicSNRTAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref SingaporePublicRT
      SubnetId: !Ref SingaporePublicSN

  SingaporePrivateSNRTAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref SingaporePrivateRT
      SubnetId: !Ref SingaporePrivateSN1

  SingaporePrivateSNRTAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref SingaporePrivateRT
      SubnetId: !Ref SingaporePrivateSN2

  SingaporeTGWSNRTAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref SingaporeTGWRT
      SubnetId: !Ref SingaporeTGWSN1

  SingaporeTGWSNRTAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref SingaporeTGWRT
      SubnetId: !Ref SingaporeTGWSN2

  # SG 
  SingaporeSG1:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref SingaporeVPC
      GroupDescription: SingaporeVPC-NAT-ALB-WEBSRV-SG
      Tags:
      - Key : Name
        Value : SingaporeVPC-NAT-ALB-WEBSRV-SG
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        CidrIp: 0.0.0.0/0
      - IpProtocol: icmp
        FromPort: -1
        ToPort: -1
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 3306
        ToPort: 3306
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 53
        ToPort: 53
        CidrIp: 0.0.0.0/0
      - IpProtocol: udp
        FromPort: 53
        ToPort: 53
        CidrIp: 0.0.0.0/0

  SingaporeSG2:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref SingaporeVPC
      GroupDescription: SingaporeVPC-Route53-Resolver-SG
      Tags:
      - Key : Name
        Value : SingaporeVPC-Route53-Resolver-SG
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 53
        ToPort: 53
        CidrIp: 0.0.0.0/0
      - IpProtocol: udp
        FromPort: 53
        ToPort: 53
        CidrIp: 0.0.0.0/0
      - IpProtocol: icmp
        FromPort: -1
        ToPort: -1
        CidrIp: 0.0.0.0/0


  ### NAT ###

  # ENI
  # NAT 인스턴스가 VPC 내에서 통신하기 위한 네트워크 인터페이스
  # ENI를 통해 서브넷에 연결됨
  # NAT 인스턴스의 네트워크 구성을 따로 만든 것
  SingaporeNATENI:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref SingaporePublicSN
      Description: Instance1 eth0
      GroupSet:
      - !Ref SingaporeSG1
      # 고정 사설 IP
      PrivateIpAddress: 10.3.1.100
      # NAT 만들 때 반드시 들어가야함 -> 중계 역할이므로 false로
      SourceDestCheck: false
      Tags:
        - Key: Name
          Value: Singapore-NAT-Instance eth0

  # EIP
  # NAT 인스턴스가 인터넷 통신 위해 고정된 퍼블릭 IP 주소 받음
  SingaporeEIP:
    Type: AWS::EC2::EIP
    Properties:
    # Elastic IP가 VPC 내에서 사용될 것임을 지정
      Domain: vpc

  # EIP - ENI
  SingaporeENIAssociateEIP:
    Type: AWS::EC2::EIPAssociation
    DependsOn: SingaporeNATInstance
    Properties:
      # EIP를 참조
      # AllocationId는 Elastic IP의 고유 식별자
      # 생성한 EIP를 참조하여 해당 EIP의 고유 식별자를 가져옴
      AllocationId: !GetAtt SingaporeEIP.AllocationId
      # ENI를 참조
      # 특정 네트워크 인터페이스(ENI)의 고유 식별자
      # 구성된 네트워크 인터페이스(ENI)를 참조하여 어떤 ENI에 EIP를 연결할지를 지정
      NetworkInterfaceId: !Ref SingaporeNATENI

  # NAT Instance
  SingaporeNATInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-00004f35d3112b57b
      InstanceType: t2.micro
      KeyName: !Ref KeyName
      Tags:
        - Key: Name
          Value: Singapore-NAT-Instance
      NetworkInterfaces:
      # ENI에 구성 정보 이미 작성
        - DeviceIndex: 0
          NetworkInterfaceId: !Ref SingaporeNATENI
      UserData:
        Fn::Base64: |
          #!/bin/bash
            hostname Singapore-NAT-Instance
            yum -y install tcpdump iptraf

  ## GA 환경을 위함 ##
  # EC2
  SingaporeWEBSRV:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t2.micro
      KeyName: !Ref KeyName
      Tags:
        - Key: Name
          Value: Singapore-WEBSRV
      NetworkInterfaces:
        - DeviceIndex: 0
          SubnetId: !Ref SingaporePrivateSN1
          GroupSet:
          - !Ref SingaporeSG1
          PrivateIpAddress: 10.3.3.100
      # 설치 확인하려면 bastion host ec2로 들어가서 keys 저장하고 -> chmod -> ssh -i
      UserData:
        Fn::Base64: |
          #!/bin/bash
          (
          echo "CHANGE_ME_PASSWORD"
          echo "CHANGE_ME_PASSWORD"
          ) | passwd --stdin root
          sed -i "s/^PasswordAuthentication no/PasswordAuthentication yes/g" /etc/ssh/sshd_config
          sed -i "s/^#PermitRootLogin yes/PermitRootLogin yes/g" /etc/ssh/sshd_config
          sudo service sshd restart

          hostnamectl --static set-hostname Singapore-WEBSRV
          amazon-linux-extras install epel -y 
          sudo yum install -y httpd php php-mysql tcpdump         
          sudo systemctl enable --now httpd 
          sudo sed -i 's/;date.timezone =/date.timezone = Asia\/Singapore/' /etc/php.ini
          sudo sed -i 's/display_errors = Off/display_errors = On' /etc/php.ini
          sudo systemctl restart httpd

          cat << EOF > /var/www/html/index.html
          <HTML>
          <HEAD>
          <META http-equiv="content-type" content="text/html; charset=utf8mb4">
          </HEAD>
          <BODY>
          <h1> 회원 관리 시스템3 </h1>
          <a href='select.php'> (1) 회원 조회 (조회 후 수정/삭제 가능) </a> <br><br>
          <a href='insert.php'> (2) 신규 회원 등록 </a> <br><br>
          <FORM METHOD="get"  ACTION="update.php">
              (3) 회원 수정 - 회원 아이디 : <INPUT TYPE ="text" NAME="userID"> 
              <INPUT TYPE="submit"  VALUE="수정">
          </FORM>
          <FORM METHOD="get"  ACTION="delete.php">
              (4) 회원 삭제 - 회원 아이디 : <INPUT TYPE ="text" NAME="userID"> 
              <INPUT TYPE="submit"  VALUE="삭제">
          </FORM>
          </BODY>
          </HTML>
          EOF

          echo "<?php          
          \$con=mysqli_connect(\"10.2.1.100\", \"user1\", \"CHANGE_ME_PASSWORD\", \"sqlDB\") or die(\"MySQL 접속 실패 !!\");
          mysqli_query(\$con, \"set session character_set_connection=utf8mb4;\");
          mysqli_query(\$con, \"set session character_set_results=utf8mb4;\");
          mysqli_query(\$con, \"set session character_set_client=utf8mb4;\");
          \$sql =\"SELECT * FROM userTBL\";
 
          \$ret = mysqli_query(\$con, \$sql);   
          if(\$ret) {
              \$count = mysqli_num_rows(\$ret);
          }
          else {
              echo \"userTBL 데이터 조회 실패!!!\".\"<br>\";
              echo \"실패 원인 :\".mysqli_error(\$con);
              exit();
          } 
   
          echo \"<h1> 회원 조회 결과3 </h1>\";
          echo \"<TABLE border=1>\";
          echo \"<TR>\";
          echo \"<TH>아이디</TH><TH>이름</TH><TH>출생년도</TH><TH>지역</TH><TH>극번</TH>\";
          echo \"<TH>전화번호</TH><TH>키</TH><TH>가입일</TH><TH>수정</TH><TH>삭제</TH>\";
          echo \"</TR>\";
   
          while(\$row = mysqli_fetch_array(\$ret)) {
             echo \"<TR>\";
             echo \"<TD>\", \$row['userID'], \"</TD>\";
             echo \"<TD>\", \$row['name'], \"</TD>\";
             echo \"<TD>\", \$row['birthYear'], \"</TD>\";
             echo \"<TD>\", \$row['addr'], \"</TD>\";
             echo \"<TD>\", \$row['mobile1'], \"</TD>\";
             echo \"<TD>\", \$row['mobile2'], \"</TD>\";
             echo \"<TD>\", \$row['height'], \"</TD>\";
             echo \"<TD>\", \$row['mDATE'], \"</TD>\";
             echo \"<TD>\", \"<a href='update.php?userID=\", \$row['userID'], \"'>수정</a>\", \"</TD>\";
             echo \"<TD>\", \"<a href='delete.php?userID=\", \$row['userID'], \"'>삭제</a>\", \"</TD>\";
             echo \"</TR>\";
          }   
          mysqli_close(\$con);
          echo \"</TABLE>\";
          echo \"<br> <a href='main.html'> <--초기 화면</a> \";
                 ?>" > /var/www/html/select.php

          cat > /var/www/html/insert.php <<EOF
          <HTML>
          <HEAD>
          <META http-equiv="content-type" content="text/html; charset=utf-8">
          </HEAD>
          <BODY>
          <h1> 신규 회원 입력3 </h1>
          <FORM METHOD="post" ACTION="insert_result.php"> 
              아이디 :<INPUT TYPE="text" NAME="userID"> <br>
              이름 :<INPUT TYPE="text" NAME="name"> <br>
              출생년도 :<INPUT TYPE="text" NAME="birthYear"> <br>
              지역 :<INPUT TYPE="text" NAME="addr"> <br>
              휴대폰 국번 :<INPUT TYPE="text" NAME="mobile1"> <br>
              휴대폰 전화번호 :<INPUT TYPE="text" NAME="mobile2"> <br>
              신장 :<INPUT TYPE="text" NAME="height"><br>
              <BR><BR>
              <INPUT TYPE="submit" VALUE="회원 입력">
          </FORM>
          </BODY>
          </HTML>
          EOF

          cat > /var/www/html/insert_result.php <<EOF
          <?php
          $con = mysqli_connect("10.4.1.100", "user1", "CHANGE_ME_PASSWORD", "sqlDB") or die("MySQL 접속 실패 !!");
          mysqli_query($con, "set session character_set_connection=utf8mb4;");
          mysqli_query($con, "set session character_set_results=utf8mb4;");
          mysqli_query($con, "set session character_set_client=utf8mb4;");

          \$userID = \$_POST["userID"];
          \$name = \$_POST["name"];
          \$birthYear = \$_POST["birthYear"];
          \$addr = \$_POST["addr"];
          \$mobile1 = \$_POST["mobile1"];
          \$mobile2 = \$_POST["mobile2"];
          \$height = \$_POST["height"];
          \$mDate = date("Y-m-j");

          \$sql = "INSERT INTO userTBL VALUES('\$userID', '\$name', \$birthYear, '\$addr', '\$mobile1', '\$mobile2', \$height, '\$mDate')";

          \$ret = mysqli_query(\$con, \$sql);

          echo "<h1> 신규 회원 입력 결과3 </h1>";
          if(\$ret) {
              echo "데이터가 성공적으로 입력됨.";} else {
              echo "데이터 입력 실패!!!<br>";
              echo "실패 원인 :" . mysqli_error(\$con);}
          mysqli_close(\$con);

          echo "<br> <a href='main.html'> <--초기 화면</a> ";?>
          EOF  

          curl -o /opt/pingcheck.sh https://cloudneta-book.s3.ap-northeast-2.amazonaws.com/chapter8/pingchecker.sh
          chmod +x /opt/pingcheck.sh
          cat <<EOT>> /etc/crontab
          */3 * * * * root /opt/pingcheck.sh
          EOT



  ############################## DNS 파트 #############################
  
  ### Route 53 ###
  ### 프라이빗 호스팅 ###
  # 호스팅 영역
  SingaporePrivateHZ:
    Type: AWS::Route53::HostedZone
    # VPC 내에서만 DNS가 유효
    # VPC가 존재하지 않으면 호스티드 존을 해당 VPC에 연결할 수 없기 때문
    DependsOn: SingaporeVPC
    Properties:
      HostedZoneConfig:
        Comment: Private hosted zone for singapore.net
      Name: awssingapore.internal
      # 프라이빗 호스팅 영역이기 때문에 VPC 설정 해줘야함
      VPCs:
      # 이 호스티드 존이 연결될 VPC
        - VPCId: !Ref SingaporeVPC
      # 해당 VPC가 속한 AWS 리전
          VPCRegion: ap-southeast-1
      HostedZoneTags:
        - Key: Name
          Value: singaporeomain

  # seoul.internal 존에 만들 A 레코드
  ARecordSingaporeWEBSRV:
    Type: AWS::Route53::RecordSet
    Properties:
    # 이 호스트 영역(존)에 레코드 만들겠다.
      HostedZoneId: !Ref SingaporePrivateHZ
      Comment: DNS name for Singapore-WEBSRV instance.
    # 도메인 이름
      Name: websrv1.awssingapore.internal
      Type: A
      TTL: 60
    # 위의 도메인의 IP
      ResourceRecords:
      - !GetAtt SingaporeWEBSRV.PrivateIp

  ### DNS 쿼리 ###
  # 인바운드 엔드 포인트
  SingaporeInboundEP:
    Type: AWS::Route53Resolver::ResolverEndpoint
    Properties:
      Direction: INBOUND
      IpAddresses:
        - Ip: 10.3.3.250
          SubnetId: !Ref SingaporePrivateSN1
        - Ip: 10.3.4.250
          SubnetId: !Ref SingaporePrivateSN2
      SecurityGroupIds:
        - !Ref SingaporeSG2
      Tags:
        - Key: Name
          Value: idc-to-singapore-inbound

  # 아웃바운드 엔드포인트
  SingaporeOutboundEP:
    Type: AWS::Route53Resolver::ResolverEndpoint
    Properties:
      Direction: OUTBOUND
      IpAddresses:
        - Ip: 10.3.3.251
          SubnetId: !Ref SingaporePrivateSN1
        - Ip: 10.3.4.251
          SubnetId: !Ref SingaporePrivateSN2
      SecurityGroupIds:
        - !Ref SingaporeSG2
      Tags:
        - Key: Name
          Value: seoul-to-idc-outbound
  
  # 포워드 규칙
  SingaporeForwardRule1:
    Type: AWS::Route53Resolver::ResolverRule
    Properties:
      DomainName: idcsingapore.internal
      Name: Singapore-To-IDC-ForwardRule
      ResolverEndpointId: !Ref SingaporeOutboundEP
      RuleType: FORWARD
      Tags:
        - Key: Name
          Value: idc singapore rule
      TargetIps:
      # idcsingapore.internal의 DNS 서버 주소
        - Ip: 10.4.1.200
          Port: 53
  
  # 포워드 규칙과 VPC 연결
  # 아웃바운드 포워드 규칙을 넣을 VPC
  SingaporeResolverRuleAssociation1:
    Type: AWS::Route53Resolver::ResolverRuleAssociation
    Properties:
      Name: Singapore-Resolver-Rule-Association1
      ResolverRuleId: !Ref SingaporeForwardRule1
      VPCId: !Ref SingaporeVPC

  SingaporeForwardRule2:
    Type: AWS::Route53Resolver::ResolverRule
    Properties:
      DomainName: awsseoul.internal
      Name: aws seoul rule
      ResolverEndpointId: !Ref SingaporeOutboundEP
      RuleType: FORWARD
      Tags:
        - Key: Name
          Value: aws seoul rule
      TargetIps:
        - Ip : 10.1.3.250
          Port : 53
        - Ip : 10.1.4.250
          Port : 53

  SingaporeResolverRuleAssociation2:
    Type: AWS::Route53Resolver::ResolverRuleAssociation
    Properties:
      Name: Singapore-Resolver-Rule-Association2
      ResolverRuleId: !Ref SingaporeForwardRule2
      VPCId: !Ref SingaporeVPC

  SingaporeForwardRule3:
    Type: AWS::Route53Resolver::ResolverRule
    Properties:
      DomainName: idcseoul.internal
      Name: idc seoul rule
      ResolverEndpointId: !Ref SingaporeOutboundEP
      RuleType: FORWARD
      Tags:
        - Key: Name
          Value: idc seoul rule
      TargetIps:
        - Ip : 10.2.1.200
          Port : 53

  SingaporeResolverRuleAssociation3:
    Type: AWS::Route53Resolver::ResolverRuleAssociation
    Properties:
      Name: Singapore-Resolver-Rule-Association3
      ResolverRuleId: !Ref SingaporeForwardRule3
      VPCId: !Ref SingaporeVPC


  ############################## DNS 파트 #############################

  ############################## TGW 파트 #############################

  # 싱가포르 Transit Gateway
  SingaporeTGW:
    Type: AWS::EC2::TransitGateway
    Properties:
      Tags:
        - Key: Name
          Value: SingaporeTGW

  # Singapore VPC와 TGW를 연결
  # 콘솔에서 attachment 타입을 VPC로 한 것
  SingaporeVPCTGWAtt:
    Type: AWS::EC2::TransitGatewayAttachment
    DependsOn: SingaporeVPC
    Properties:
      VpcId: !Ref SingaporeVPC
      # VPC 내부에서 Transit Gateway와 통신할 수 있는 서브넷의 ID 목록.
      SubnetIds:
        - !Ref SingaporeTGWSN1
        - !Ref SingaporeTGWSN2
      TransitGatewayId: !Ref SingaporeTGW
      Tags:
        - Key: Name
          Value: Singapore-VPC-TGWAtt

  # VPC -> TGW 가는 경로 추가
  # VPC의 라우트 테이블에 Transit Gateway로의 라우팅 규칙을 추가
  SingaporeVPCTGWRoute:
    Type: AWS::EC2::Route
    DependsOn: SingaporeVPCTGWAtt
    Properties:
    # 이 경로가 추가될 라우트 테이블
      RouteTableId: !Ref SingaporePrivateRT
      # 10.0.0.0/8 대역 트래픽이 Transit Gateway로 전송되도록 설정
      DestinationCidrBlock: 10.0.0.0/8
      # 트래픽을 전달할 TGW
      TransitGatewayId: !Ref SingaporeTGW

  ### IDC-VPC ###
  # VPC
  IDCSingaporeVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.4.0.0/16
      # 둘다 true로 해주면 -> resolv.conf 파일 nameserver 10.4.1.200
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: IDC-Singapore-VPC

  # IGW
  IDCSingaporeIGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: IDC-Singapore-IGW
  
  # VPC-IGW 
  IDCSingaporeVPCIGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref IDCSingaporeIGW
      VpcId: !Ref IDCSingaporeVPC

  # RT
  IDCSingaporeDNSDBRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref IDCSingaporeVPC
      Tags:
        - Key: Name
          Value: IDCSingapore-IGW-RT

  IDCSingaporeCGWRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref IDCSingaporeVPC
      Tags:
        - Key: Name
          Value: IDCSingapore-CGW-RT

  # IGW - RT
  IDCSingaporeDNSDBRoute1:
    Type: AWS::EC2::Route
    DependsOn: IDCSingaporeVPCIGWAttachment
    Properties:
    # 라우트가 추가될 라우트 테이블
      RouteTableId: !Ref IDCSingaporeDNSDBRT
    # 이 IP 주소를 대상으로 하는 경로를 정의
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IDCSingaporeIGW
      
  # DNS와 SlaveDB가 CGW를 통해 외부와 통신 위해
  IDCSingaporeDNSDBRoute2:
    Type: AWS::EC2::Route
    DependsOn: IDCSingaporeCGWENI
    Properties:
    # 라우트가 추가될 라우트 테이블
      RouteTableId: !Ref IDCSingaporeDNSDBRT
    # 이 IP 주소를 대상으로 하는 경로를 정의
      DestinationCidrBlock: 10.0.0.0/8 
    # 위 경로의 트래픽이 전달될 대상 네트워크 인터페이스(ENI)
      NetworkInterfaceId: !Ref IDCSingaporeCGWENI

  IDCSingaporeCGWRoute:
    Type: AWS::EC2::Route
    DependsOn: IDCSingaporeVPCIGWAttachment
    Properties:
    # 라우트가 추가될 라우트 테이블
      RouteTableId: !Ref IDCSingaporeCGWRT
    # 이 IP 주소를 대상으로 하는 경로를 정의
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IDCSingaporeIGW

  # SN
  IDCSingaporePublicSN:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref IDCSingaporeVPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.4.1.0/24
      Tags: 
        - Key: Name
          Value: IDCSingapore-Public-SN

  IDCSingaporeTGWSN:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref IDCSingaporeVPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.4.2.0/24
      Tags: 
        - Key: Name
          Value: IDCSingapore-TGW-SN

  # RT - SN
  IDCSingaporeDNSDBSNRTAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref IDCSingaporeDNSDBRT
      SubnetId: !Ref IDCSingaporePublicSN

  IDCSingaporeTGWSNRTAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref IDCSingaporeCGWRT
      SubnetId: !Ref IDCSingaporeTGWSN

  # SG
  IDCSingaporeCGWDBSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref IDCSingaporeVPC
      GroupDescription: IDCSingapore-CGWDB-SG
      Tags:
      - Key : Name
        Value : IDCSingapore-CGWDB-SG
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp: 0.0.0.0/0
      - IpProtocol: icmp
        FromPort: -1
        ToPort: -1
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 3306
        ToPort: 3306
        CidrIp: 0.0.0.0/0
      - IpProtocol: udp
        FromPort: 4500
        ToPort: 4500
        CidrIp: 0.0.0.0/0
      - IpProtocol: udp
        FromPort: 53
        ToPort: 53
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 53
        ToPort: 53
        CidrIp: 0.0.0.0/0

  IDCSingaporeDNSSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref IDCSingaporeVPC
      GroupDescription: IDCSingapore-DNS-SG
      Tags:
      - Key : Name
        Value : IDCSingapore-DNS-SG
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        CidrIp: 0.0.0.0/0
      - IpProtocol: udp
        FromPort: 53
        ToPort: 53
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 53
        ToPort: 53
        CidrIp: 0.0.0.0/0
      - IpProtocol: icmp
        FromPort: -1
        ToPort: -1
        CidrIp: 0.0.0.0/0

  # ENI
  IDCSingaporeCGWENI:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref IDCSingaporeTGWSN
      Description: CGWInstance eth0
      GroupSet:
      - !Ref IDCSingaporeCGWDBSG
     # 고정 사설 IP
      PrivateIpAddress: 10.4.2.100
      Tags:
        - Key: Name
          Value: IDCSingapore-CGWENI 
  
  # EIP
  IDCSingaporeCGWEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  # EIP - ENI
  IDCSingaporeCGWENIAssociateEIP:
    Type: AWS::EC2::EIPAssociation
    DependsOn: IDCSingaporeCGW
    Properties:
      AllocationId: !GetAtt IDCSingaporeCGWEIP.AllocationId
      NetworkInterfaceId: !Ref IDCSingaporeCGWENI

  # NAT Instance
  IDCSingaporeCGW:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t2.micro
      KeyName: !Ref KeyName
      Tags:
        - Key: Name
          Value: IDCSingapore-CGW
      # 중계 역할
      SourceDestCheck: false
      NetworkInterfaces:
        - DeviceIndex: 0
          NetworkInterfaceId: !Ref IDCSingaporeCGWENI
      UserData:
      # 리눅스용 VPN 패키지
      # 커널 수준에서 설정 변경 /etc/sysctl.conf
      # net.ipv4.ip_forward=1 디폴트 값은 0 -> 1로 되어있어야 리눅스에서 전송가능
      # ipsec 데몬
        Fn::Base64: |
          #!/bin/bash
          hostnamectl --static set-hostname IDCSingapore-CGW
          yum -y install tcpdump openswan
          cat <<EOF>> /etc/sysctl.conf
          net.ipv4.ip_forward=1
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.all.send_redirects = 0
          net.ipv4.conf.default.send_redirects = 0
          net.ipv4.conf.eth0.send_redirects = 0
          net.ipv4.conf.default.accept_redirects = 0
          net.ipv4.conf.eth0.accept_redirects = 0
          net.ipv4.conf.ip_vti0.rp_filter = 0
          net.ipv4.conf.eth0.rp_filter = 0
          net.ipv4.conf.default.rp_filter = 0
          net.ipv4.conf.all.rp_filter = 0
          EOF
          sysctl -p /etc/sysctl.conf
          curl -o /etc/ipsec.d/vpnconfig.sh https://cloudneta-book.s3.ap-northeast-2.amazonaws.com/chapter6/6_lab_s2s-vpnconfig.sh
          chmod +x /etc/ipsec.d/vpnconfig.sh

          sed -i 's/leftsubnet=10\.60\.0\.0\/16/leftsubnet=10.4.0.0\/16/' /etc/ipsec.d/vpnconfig.sh
          sed -i 's/rightsubnet=10\.50\.0\.0\/16/rightsubnet=10.0.0.0\/8/' /etc/ipsec.d/vpnconfig.sh
          systemctl restart ipsec
          

  ## DNSSRV ##
  # ENI
  # EC2 인스턴스가 VPC 내에서 다른 리소스와 연결되는 방법을 정의
  IDCSingaporeDNSENI:
    Type: AWS::EC2::NetworkInterface
    Properties:
    # 인터페이스 내부 속성들 미리 정의
      SubnetId: !Ref IDCSingaporePublicSN
      Description: IIDCSingaporePublicSN eth0
      GroupSet:
      - !Ref IDCSingaporeDNSSG
    # 고정 사설 IP
      PrivateIpAddress: 10.4.1.200
    # 기본값 true, 그러나 false도 포워딩 역할 아니므로 필요없음
      Tags:
        - Key: Name
          Value: IDCSingapore-DNS-ENI

  # DNSSRV에 공인 IP 할당
  IDCSingaporeDNSEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  # ENI - EIP        
  IDCSingaporeDNSENIAssociateEIP:
    Type: AWS::EC2::EIPAssociation
  # EIP와 ENI가 생성되고 연결되기 전에 IDCSingaporeDNSSRV 인스턴스가 생성되면 안 되므로
    DependsOn: IDCSingaporeDNSSRV
    Properties:
      # AllocationId는 Elastic IP의 고유 식별자
      AllocationId: !GetAtt IDCSingaporeDNSEIP.AllocationId
      # 구성된 네트워크 인터페이스(ENI)를 참조하여 어떤 ENI에 EIP를 연결할지를 지정
      NetworkInterfaceId: !Ref IDCSingaporeDNSENI

  IDCSingaporeDNSSRV:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t2.micro
      KeyName: !Ref KeyName
      Tags:
        - Key: Name
          Value: IDCSingapore-DNSSRV
      NetworkInterfaces:
        - DeviceIndex: 0
          # 서브넷 없는 이유 ENI에 들어가 있기 때문
          NetworkInterfaceId: !Ref IDCSingaporeDNSENI
      UserData:
        Fn::Base64: |
          #!/bin/bash
          hostnamectl --static set-hostname IDCSingapore-DNSSRV
          amazon-linux-extras install epel -y
          yum -y install bind bind-utils bind-libs
          sed -i "s/listen-on port 53 { 127.0.0.1; }/listen-on port 53 { any; }/g" /etc/named.conf
          sed -i "s/allow-query     { localhost; }/allow-query     { any; }/g" /etc/named.conf
          sed -i "s/dnssec-enable yes/dnssec-enable no/g" /etc/named.conf		  
          sed -i "s/dnssec-validation yes/dnssec-validation no/g" /etc/named.conf
          
          cat <<EOF>> /etc/named.rfc1912.zones	
          zone "idcsingapore.internal" {
              type master;
              file "/var/named/idcsingapore.internal";
              allow-update { none; };
          };		  
          zone "awssingapore.internal" {
              type forward;
              forward only;
              forwarders { 10.3.3.250; };
          }; 
          zone "awsseoul.internal" {
              type forward;
              forward only;
              forwarders { 10.1.3.250; 10.1.4.250; };
          };
          zone "idcseoul.internal" {
              type forward;
              forward only;
              forwarders { 10.2.1.200; };
          };            
          EOF
          
          cat <<EOF> /var/named/idcsingapore.internal
          \$TTL 300
          @ IN SOA idcsingapore.internal. root.idcsingapore.internal. (
            2019122114 ; serial
            3600       ; refresh
            900        ; retry
            604800     ; expire
            86400      ; minimum
          )

          @           IN NS ns1.idcsingapore.internal.
          ns1         IN A  10.4.1.200
          dbsrv       IN A  10.4.1.100
          dnssrv      IN A  10.4.1.200
          
          EOF

          cat <<EOF> /var/named/idcseoul.internal
          \$TTL 300
          @ IN SOA idcseoul.internal. root.idcseoul.internal. (
            2025020201 ; serial
            3600       ; refresh
            900        ; retry
            604800     ; expire
            86400      ; minimum
          )

          @           IN NS ns1.idcseoul.internal.
          ns1         IN A  10.2.1.200
          dbsrv       IN A  10.2.1.100
          dnssrv      IN A  10.2.1.200
          EOF
          
          systemctl enable --now named

  # EC2
  ## Slave DB ##
  IDCSingaporeSlaveDB:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t2.micro
      KeyName: !Ref KeyName
      Tags:
        - Key: Name
          Value: IDCSingapore-SlaveDB
      NetworkInterfaces:
        - DeviceIndex: 0
          SubnetId: !Ref IDCSingaporePublicSN
          GroupSet:
          - !Ref IDCSingaporeCGWDBSG
          AssociatePublicIpAddress: true
          PrivateIpAddress: 10.4.1.100
      UserData:
      # /etc/resolv.conf 파일이 네임서버가 DNSSRV 설정이 되어 있어야함
        Fn::Base64: |
          #!/bin/bash
          (
          echo "CHANGE_ME_PASSWORD"
          echo "CHANGE_ME_PASSWORD"
          ) | passwd --stdin root
          sed -i "s/^PasswordAuthentication no/PasswordAuthentication yes/g" /etc/ssh/sshd_config
          sed -i "s/^#PermitRootLogin yes/PermitRootLogin yes/g" /etc/ssh/sshd_config
          sudo service sshd restart
          sudo sed -i 's/^nameserver 10\.4\.0\.2$/nameserver 10.4.1.200/' /etc/resolv.conf

          cat <<EOT> /home/ec2-user/list.txt
          10.1.3.100
          websrv1.awsseoul.internal
          10.1.4.100
          websrv2.awsseoul.internal
          10.4.1.100
          dbsrv.idcseoul.internal
          10.4.1.200
          dnssrv.idcseoul.internal
          10.3.3.100
          websrv1.awssingapore.internal
          10.4.1.100
          dbsrv.idcsingapore.internal
          10.4.1.200
          dnssrv.idcsingapore.internal
          EOT
          curl -o /home/ec2-user/pingall.sh https://cloudneta-book.s3.ap-northeast-2.amazonaws.com/chapter6/pingall.sh --silent
          chmod +x /home/ec2-user/pingall.sh

          hostnamectl --static set-hostname IDCSingapore-SlaveDB

          sudo yum install -y https://dev.mysql.com/get/mysql80-community-release-el7-6.noarch.rpm
          sudo rpm --import https://repo.mysql.com/RPM-GPG-KEY-mysql-2022
          sudo sed -i '/^\[mysql80-community\]/,/^$/s/^gpgcheck=1/gpgcheck=0/' /etc/yum.repos.d/mysql-community.repo
          sudo yum update -y
          sudo yum install -y mysql-server
          sudo systemctl start mysqld
          sudo systemctl enable mysqld
          sudo yum install -y sshpass

          sudo echo -e "\ncollation-server = utf8mb4_unicode_ci\ninit-connect='SET NAMES utf8mb4'\ncharacter-set-server = utf8mb4\nvalidate_password.policy = LOW\ndefault_authentication_plugin = mysql_native_password\n\n[client]\ndefault-character-set = utf8mb4\n\n[mysql]\ndefault-character-set = utf8mb4" | sudo tee -a /etc/my.cnf
          sudo systemctl restart mysqld

          TEMP_PASS=$(grep 'temporary password' /var/log/mysqld.log | awk '{print $NF}')
          mysql -uroot -p"$TEMP_PASS" --connect-expired-password -e " ALTER USER 'root'@'localhost' IDENTIFIED BY 'CHANGE_ME_PASSWORD';"



  ### IDC -TGW ###
  # IDC의 CGW 인식시키게 하기
  IDCSingaporeCGWPerceive:
    Type: AWS::EC2::CustomerGateway
    DependsOn: IDCSingaporeCGWEIP
    Properties:
      Type: ipsec.1
      BgpAsn: 65000
      # IDC의 CGW 공인IP
      IpAddress: !Ref IDCSingaporeCGWEIP
      Tags:
        - Key: Name
          Value: IDCSingapore-CGW-Perceive

  # CGW - TGW 연결
  SingaporeVPCIDCVpnConnection:
    Type: AWS::EC2::VPNConnection
    Properties:
      # VPN 연결의 유형을 지정
      # IPsec 기반의 사이트-투-사이트 VPN을 설정
      Type: ipsec.1
      # 정적 경로
      # TGW 라우팅 테이블로 자동으로 경로 안들어오기 때문에
      StaticRoutesOnly: true
      # 인식시킨 CGW
      CustomerGatewayId: !Ref IDCSingaporeCGWPerceive
      # VPC가 아닌 VPN과 연결
      TransitGatewayId: !Ref SingaporeTGW
      VpnTunnelOptionsSpecifications:
      # PSK
        - PreSharedKey: CHANGE_ME_PSK
      Tags:
        - Key: Name
          Value: SingaporeVPC-IDCVpn-Connection
  
  # 배포 후 VPN 연결로 생성된 값을 채워 주석을 해제합니다.
  # (TGW 라우팅 테이블에는 VPN 경로가 자동으로 들어오지 않아 정적 경로를 추가)
  # TGWStaticRoute:
  #   Type: AWS::EC2::TransitGatewayRoute
  #   Properties:
  #     DestinationCidrBlock: 10.4.0.0/16
  #     TransitGatewayRouteTableId: <TGW_ROUTE_TABLE_ID>
  #     TransitGatewayAttachmentId: <VPN_TGW_ATTACHMENT_ID>
